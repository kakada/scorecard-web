  data_quality_kpi_panel_title: "គុណភាពទិន្នន័យ KPI"
  data_quality_kpi_panel_description: |
    <div lang="km-KH">
    <p><strong>KPI គុណភាពទិន្នន័យ</strong></p>
    <p>តារាងនេះតាមដានសូចនាករសំខាន់ៗនៃគុណភាពទិន្នន័យប័ណ្ណដាក់ពិន្ទុ</p>
    <ul>
      <li><strong>ចំនួនប័ណ្ណបានដាក់ស្នើ</strong> — ប័ណ្ណដាក់ពិន្ទុដែលបានដាក់ស្នើដោយ CAFs/Peers</li>
      <li><strong>ចំនួនប័ណ្ណបានអនុម័ត</strong> — ប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តដោយ Local NGO (មិនរាប់បញ្ចូលប័ណ្ណដែលបានបដិសេធ)</li>
      <li><strong>ចំនួនប័ណ្ណបានបដិសេធ</strong> — ប័ណ្ណដាក់ពិន្ទុដែលបានបដិសេធដោយ Program team</li>
      <li><strong># កែសម្រួលសូចនាករថ្មី</strong> — indicator ប្រភេទ custom ដែលត្រូវបានកែប្រែដោយ Local NGO (ពោលគឺបានធ្វើបច្ចុប្បន្នភាពក្រោយពេលបានបង្កើតដំបូង)</li>
    </ul>
    <p><strong>តម្លៃបច្ចុប្បន្ន៖</strong> ដាក់ស្នើ 5 / អនុម័ត 3 / បដិសេធ 1 / ការកែតម្រូវ Indicator ថ្មី 0។</p>
    <p><strong>ឧទាហរណ៍៖</strong> ក្នុងចំណោមប័ណ្ណដាក់ពិន្ទុដែលបានដាក់ស្នើ 5 មាន 3 ត្រូវបានអនុម័ត និង 1 ត្រូវបានបដិសេធ ខណៈមាន 1 នៅសល់កំពុងរង់ចាំការត្រួតពិនិត្យ។ គ្មាន indicator ថ្មីណាមួយត្រូវការកែតម្រូវដោយ Local NGO ទេ។</p>
    </div>

