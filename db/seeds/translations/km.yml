km:
  # Panel title and description
  map_panel_title: ផែនទីអនុវត្តប័ណ្ណដាក់ពិន្ទុឌីជីថល
  summary_panel_title: សង្ខេបប័ណ្ណដាក់ពិន្ទុ
  scorecard_total_panel_title: ប័ណ្ណដាក់ពិន្ទុសរុប (គ្រោងទុកសរុប/កំពុងត្រួតពិនិត្យ/អនុម័ត)
  scorecard_total_panel_description: |
    <h5>ប័ណ្ណដាក់ពិន្ទុសរុប៖ គ្រោងទុកសរុប ១០ / កំពុងត្រួតពិនិត្យ ៥ / បានអនុម័ត ៣</h5>
    <p>
      នេះបង្ហាញពីដំណើរការរបស់ Scorecard តាមដំណាក់កាល៖
      <strong>១០ កំពុងស្ថិតក្នុងគម្រោង ៥ កំពុងពិនិត្យ និង ៣ បានអនុម័ត</strong>
      សរុបមាន <strong>១៨ Scorecards</strong>។
    </p>
    <p>
      <strong>ឧទាហរណ៍៖</strong> អ្នកគ្រប់គ្រងបង្កើត Scorecard សម្រាប់ការវាយតម្លៃការងារត្រីមាសទី ៣
      ហើយវាចាប់ផ្តើមដោយ Status <em>គ្រោងទុក</em>។ នៅពេលប័ណ្ណដាក់ពិន្ទុត្រូវបានបំពេញ
      និងដាក់ស្នើសម្រាប់ការវាយតម្លៃ វានឹងប្តូរ Status ទៅជា <em>កំពុងត្រួតពិនិត្យ</em>។
      បន្ទាប់ពីអ្នកពិនិត្យបានអនុម័ត វានឹងប្តូរ Status ទៅជា <em>បានអនុម័ត</em>។
    </p>
  scorecard_entered_after_actual_implementation_date_panel_title: ចំនួនប័ណ្ណដាក់ពិន្ទុដែលបានបញ្ចូលទិន្នន័យក្រោយថ្ងៃអនុវត្តជាក់ស្តែង
  scorecard_entered_after_actual_implementation_date_panel_description: |
    <div lang="km-KH">
    <p><strong>ចំនួនប័ណ្ណដាក់ពិន្ទុដែលបានបញ្ចូលទិន្នន័យក្រោយថ្ងៃអនុវត្តជាក់ស្តែង</strong></p>
    <p>សូចនាករនេះបង្ហាញពីចំនួនប័ណ្ណដាក់ពិន្ទុ ដែលថ្ងៃបញ្ចូលទិន្នន័យ (Entry Date) មានរយៈពេលយ៉ាងតិច ១ ថ្ងៃ ក្រោយពីថ្ងៃដែលបានអនុវត្តជាក់ស្តែង (Conducted Date)។</p>
    <p><strong>រូបមន្ត (Formula):</strong><br>
    Entry Date − Conducted Date ≥ 1 Day</p>
    <p><strong>ឧទាហរណ៍៖</strong><br>
    ថ្ងៃអនុវត្តប័ណ្ណដាក់ពិន្ទុជាក់ស្តែង៖ 01-មករា-2022<br>
    ថ្ងៃបញ្ចូលទិន្នន័យ៖ 03-មករា-2022<br>
    → ករណីនេះត្រូវបានរាប់បញ្ចូល ព្រោះមានចន្លោះពេល ២ ថ្ងៃ (≥ 1 Day)។</p>
    </div>

  scorecard_implementation_duration_panel_title: រយៈពេលអនុវត្តប័ណ្ណដាក់ពិន្ទុ (កាលបរិច្ឆេទចាប់ផ្ដើមដល់អនុម័ត)
  scorecard_implementation_duration_panel_description: |
    <div lang="km-KH">
    <p><strong>រយៈពេលអនុវត្តប័ណ្ណដាក់ពិន្ទុ (កាលបរិច្ឆេទចាប់ផ្តើមដល់អនុម័ត)</strong></p>
    <p>សូចនាករនេះវាស់ស្ទង់ចំនួនថ្ងៃ រវាង <strong>ថ្ងៃចាប់ផ្តើម</strong> និង <strong>ថ្ងៃអនុម័ត</strong> របស់ប័ណ្ណដាក់ពិន្ទុនីមួយៗ ដោយបង្ហាញរយៈពេលអប្បបរមា មធ្យម និងអតិបរមា ក្នុងចំណោមប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តទាំងអស់។</p>
    <p><strong>រូបមន្ត (Formula):</strong><br>
    រយៈពេល (ថ្ងៃ) = ថ្ងៃអនុម័ត − ថ្ងៃចាប់ផ្តើម</p>
    <p><strong>តម្លៃបច្ចុប្បន្ន៖</strong><br>
    អប្បបរមា៖ ១ ថ្ងៃ<br>
    មធ្យម៖ ១៧ ថ្ងៃ<br>
    អតិបរមា៖ ៣៦ ថ្ងៃ</p>
    <p><strong>ឧទាហរណ៍៖</strong><br>
    ប្រសិនបើប័ណ្ណដាក់ពិន្ទុមួយចាប់ផ្តើមនៅថ្ងៃ 01-មករា-2022 និងត្រូវបានអនុម័តនៅថ្ងៃ 18-មករា-2022 នោះរយៈពេលគឺ ១៧ ថ្ងៃ ដែលនៅជិតនឹងតម្លៃមធ្យម។</p>
    </div>
  scorecard_participants_panel_title: "ចំនួន (LNGOs សរុប / CAFs សរុប / អ្នកចូលរួមសរុប / អ្នកចូលរួមជាមធ្យម)"
  scorecard_participants_panel_description: |
    <div lang="km-KH">
    <p><strong>ចំនួន (LNGOs សរុប / CAFs សរុប / អ្នកចូលរួមសរុប / អ្នកចូលរួមជាមធ្យម)</strong></p>
    <p>សូចនាករនេះបង្ហាញលេខចំនួន ៤ ប្រភេទរួមគ្នា៖</p>
    <ul>
      <li><strong>LNGOs</strong> — រាប់តាម <em>Planned Scorecard</em></li>
      <li><strong>CAFs</strong> — រាប់តាម <em>LNGO</em></li>
      <li><strong>អ្នកចូលរួម</strong> — រាប់តាម <em>Approved Scorecard</em></li>
      <li><strong>អ្នកចូលរួមជាមធ្យម</strong> — ចំនួនអ្នកចូលរួមជាមធ្យមក្នុងមួយប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត</li>
    </ul>
    <p><strong>ឧទាហរណ៍៖</strong><br>
    ប្រសិនបើមាន LNGOs ចំនួន ៤ ដែលភ្ជាប់ជាមួយ CAFs ជាច្រើន ហើយប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តកត់ត្រាអ្នកចូលរួមសរុប ១៤១នាក់ នោះចំនួនអ្នកចូលរួមជាមធ្យមត្រូវបានគណនាដោយចែកអ្នកចូលរួមសរុប នឹងចំនួនប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត។</p>
    </div>
  scorecard_total_indicators_panel_title: "ចំនួនសរុប Indicator (ស្នើឡើង / ស្នើឡើងថ្មី / អាទិភាព)"
  scorecard_total_indicators_panel_description: |
    <div lang="km-KH">
    <p><strong>ចំនួនសរុប Indicator (ស្នើឡើង / ស្នើឡើងថ្មី / អាទិភាព)</strong></p>
    <p>រាប់ indicator ដែលបានលើកឡើងពីប័ណ្ណដាក់ពិន្ទុដែលបានបំពេញ៖</p>
    <ul>
      <li><strong>ស្នើឡើង (សរុប)</strong> — indicator ដែលបានលើកឡើងទាំងអស់</li>
      <li><strong>ស្នើឡើងថ្មី (សរុប)</strong> — indicator ប្រភេទ custom (បន្ថែមដោយអ្នកប្រើប្រាស់)</li>
      <li><strong>អាទិភាព (សរុប)</strong> — indicator ដែលជ្រើសយកទៅដាក់ពិន្ទុ</li>
    </ul>
    <p><strong>ឧទាហរណ៍៖</strong> ប័ណ្ណដាក់ពិន្ទុមួយលើកឡើង indicator ៥ — ថ្មី ២ អាទិភាព ១។ វានឹងបូកបញ្ចូល ៥ ទៅ ស្នើឡើង, ២ ទៅ ស្នើឡើងថ្មី, និង ១ ទៅ អាទិភាព។</p>
    </div>
  scorecard_average_indicators_panel_title: "ចំនួនមធ្យម Indicator (ស្នើឡើង / ស្នើឡើងថ្មី / អាទិភាព)"
  scorecard_average_indicators_panel_description: |
    <div lang="km-KH">
    <p><strong>ចំនួនមធ្យម Indicator (ស្នើឡើង / ស្នើឡើងថ្មី / អាទិភាព)</strong></p>
    <p>បង្ហាញចំនួនមធ្យម indicator ដែលបានលើកឡើង ក្នុងមួយប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត៖</p>
    <ul>
      <li><strong>ស្នើឡើង (មធ្យម)</strong> — មធ្យមនៃ indicator ដែលបានលើកឡើងទាំងអស់ ក្នុងមួយប័ណ្ណដែលបានអនុម័ត</li>
      <li><strong>ស្នើឡើងថ្មី (មធ្យម)</strong> — មធ្យមនៃ indicator ប្រភេទ custom ក្នុងមួយប័ណ្ណដែលបានអនុម័ត</li>
      <li><strong>អាទិភាព (មធ្យម)</strong> — មធ្យមនៃ indicator ដែលបានសម្គាល់ជា selected ក្នុងមួយប័ណ្ណដែលបានអនុម័ត</li>
    </ul>
    <p><strong>សម្គាល់៖</strong> លទ្ធផលបង្គត់ឡើង (ឧ. 0.3 → 1)។</p>
    <p><strong>ឧទាហរណ៍៖</strong> ប្រសិនបើប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត មាន Proposed Indicators មធ្យម 0.3 នោះលេខបង្ហាញនឹងបង្គត់ឡើងទៅ 1។</p>
    </div>
  scorecard_total_by_service_type_panel_title: "ប័ណ្ណដាក់ពិន្ទុសរុប (គ្រោងទុក vs អនុម័ត) តាមប្រភេទសេវា"
  scorecard_total_by_service_type_panel_description: |
    <div lang="km-KH">
    <p><strong>ចំនួនប័ណ្ណដាក់ពិន្ទុសរុប (គ្រោងទុក vs អនុម័ត) តាមប្រភេទសេវា</strong></p>
    <p>តារាងនេះប្រៀបធៀបចំនួនប័ណ្ណដាក់ពិន្ទុ <strong>ដែលបានគ្រោងទុក (Planned)</strong> និង <strong>ដែលបានអនុម័ត (Approved)</strong> តាមប្រភេទសេវានីមួយៗ ដើម្បីមើលឃើញភាពខុសគ្នារវាងផែនការ និងលទ្ធផលពិតប្រាកដ។</p>
    <p><strong>តម្លៃបច្ចុប្បន្ន៖</strong></p>
    <ul>
      <li>រដ្ឋបាលឃុំ — គ្រោងទុក 6 / បានអនុម័ត 5</li>
      <li>រោងចក្រកាត់ដេរ — គ្រោងទុក 9 / បានអនុម័ត 3</li>
    </ul>
    <p><strong>ឧទាហរណ៍៖</strong> សម្រាប់រោងចក្រកាត់ដេរ មានប័ណ្ណដាក់ពិន្ទុត្រូវបានគម្រោង 9 ប៉ុន្តែមានតែ 3 ប៉ុណ្ណោះដែលបានអនុម័ត — បង្ហាញពីគម្លាតចំនួន 6 ប័ណ្ណដែលមិនទាន់បញ្ចប់។</p>
    </div>
  scorecard_implemented_by_scorecard_type_panel_title: "ប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តតាមប្រភេទប័ណ្ណដាក់ពិន្ទុ"
  scorecard_implemented_by_scorecard_type_panel_description: |
    <div lang="km-KH" style="margin-bottom: 16px;">
    <p><strong>ប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តតាមប្រភេទប័ណ្ណដាក់ពិន្ទុ</strong></p>
    <p>តារាងនេះប្រៀបធៀបប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត តាមប្រភេទប័ណ្ណដាក់ពិន្ទុនីមួយៗ ដោយបែងចែកជា ៣ ប្រភេទ៖</p>
    <ul>
      <li><strong>វាយតម្លៃដោយខ្លួនឯង (Self-Assessment)</strong> — កិច្ចប្រជុំប័ណ្ណដាក់ពិន្ទុដែលធ្វើឡើងជាមួយថ្នាក់គ្រប់គ្រង ឬអ្នកមានសិទ្ធិសម្រេច (ភាគីផ្គត់ផ្គង់)</li>
      <li><strong>ប័ណ្ណដាក់ពិន្ទុសហគមន៍ (Community Scorecard)</strong> — កិច្ចប្រជុំប័ណ្ណដាក់ពិន្ទុដែលធ្វើឡើងជាមួយសមាជិកសហគមន៍ ឬកម្មកររោងចក្រ (ភាគីទាមទារ)</li>
      <li><strong>ប័ណ្ណដាក់ពិន្ទុរួម (Self-Assessment + Community Scorecard)</strong> — កិច្ចប្រជុំប័ណ្ណដាក់ពិន្ទុដែលបញ្ចូលគ្នារវាងថ្នាក់គ្រប់គ្រង/អ្នកមានសិទ្ធិសម្រេច និងសមាជិកសហគមន៍/កម្មកររោងចក្រ</li>
    </ul>
    <p><strong>តម្លៃបច្ចុប្បន្ន៖</strong></p>
    <ul>
      <li>មណ្ឌលសុខភាព — ការវាយតម្លៃដោយខ្លួនឯង៖ 11 / ប័ណ្ណដាក់ពិន្ទុសហគមន៍៖ 0 / ប័ណ្ណដាក់ពិន្ទុរួម៖ 0</li>
      <li>រោងចក្រកាត់ដេរ — ការវាយតម្លៃដោយខ្លួនឯង៖ 0 / ប័ណ្ណដាក់ពិន្ទុសហគមន៍៖ 0 / ប័ណ្ណដាក់ពិន្ទុរួម៖ 3</li>
    </ul>
    <p><strong>ឧទាហរណ៍៖</strong> សម្រាប់រោងចក្រកាត់ដេរ ប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័តទាំង ៣ ស្ថិតនៅក្នុងប្រភេទ "ប័ណ្ណដាក់ពិន្ទុរួម" ដោយគ្មានប័ណ្ណវាយតម្លៃដោយខ្លួនឯង ឬប័ណ្ណដាក់ពិន្ទុសហគមន៍ដាច់ដោយឡែកកត់ត្រាទេ។</p>
    </div>
