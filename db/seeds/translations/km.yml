  scorecard_completion_rate_panel_description: |
    <div lang="km-KH">
    <p><strong>អត្រាបញ្ចប់ប័ណ្ណដាក់ពិន្ទុ (%)</strong></p>
    <p>សូចនាករនេះបង្ហាញភាគរយនៃប័ណ្ណដាក់ពិន្ទុដែលបានអនុម័ត ធៀបនឹងប័ណ្ណដាក់ពិន្ទុដែលបានគ្រោងទុក។</p>
    <p><strong>រូបមន្ត (Formula):</strong><br>
    អត្រាបញ្ចប់ (%) = (ប័ណ្ណដាក់ពិន្ទុដែលបានបញ្ចប់/អនុម័ត ÷ ប័ណ្ណដាក់ពិន្ទុដែលបានគម្រោង) × 100</p>
    <p><strong>ឧទាហរណ៍៖</strong><br>
    ប្រសិនបើមានប័ណ្ណដាក់ពិន្ទុគម្រោង ៥៥ និងបានអនុម័ត ៤៥ នោះអត្រាបញ្ចប់គឺ៖<br>
    (៤៥ ÷ ៥៥) × 100 = 82%</p>
    </div>
  scorecard_geo_coverage_rate_panel_title: "អត្រាគ្របដណ្តប់ភូមិសាស្ត្រ (%)"
  scorecard_geo_coverage_rate_panel_description: |
