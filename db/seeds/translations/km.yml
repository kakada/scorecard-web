    <p><strong>អត្រាគ្របដណ្តប់ភូមិសាស្ត្រ (%)</strong></p>
    <p>សូចនាករនេះបង្ហាញពីភាគរយនៃចំនួនភូមិសាស្ត្រដែលបានសម្រេច ប្រៀបធៀបនឹងចំនួនភូមិសាស្ត្រដែលបានគ្រោងទុក។</p>

    <p><strong>រូបមន្ត (Formula):</strong><br>
    អត្រាគ្របដណ្តប់ភូមិសាស្ត្រ (%) = (ចំនួនភូមិសាស្ត្រដែលបានសម្រេច ÷ ចំនួនភូមិសាស្ត្រដែលបានគ្រោងទុក) × 100</p>

    <p><strong>ឧទាហរណ៍៖</strong><br>
    ប្រសិនបើចំនួនភូមិសាស្ត្រដែលបានគ្រោងទុកមាន ១០ តំបន់ ហើយបានសម្រេច ៨ តំបន់ នោះអត្រាគ្របដណ្តប់ភូមិសាស្ត្រគឺ៖<br>
    (៨ ÷ ១០) × 100 = 80%</p>
    </div>
