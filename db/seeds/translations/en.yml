en:
  # Panel title and description
  map_panel_title: "Digital Community Scorecard Implementation Map"
  summary_panel_title: "Scorecard Summary"
  scorecard_total_panel_title: "Total Scorecards (Planned / In Review / Approved)"
  scorecard_total_panel_description: |
    <h5>Total Scorecards: Planned 10 / In Review 5 / Approved 3</h5>
    <p>
      This shows the number of scorecards at each stage:
      <strong>Planned 10 / In Review 5 / Approved 3</strong>
      (including scorecards with <em>Completed</em> and <em>Rejected</em> statuses).
    </p>
    <p>
      <strong>Example:</strong>
      An administrator creates scorecards for the Q3 work implementation,
      with a total of <em>10</em> scorecards planned.
      Once a scorecard is completed and submitted for review,
      its status changes to <em>In Review</em>.
      After the reviewer makes a decision, the status changes to
      <em>Completed</em> or <em>Rejected</em>.
      For this KPI, both statuses are counted as <strong>Approved</strong>.
    </p>
  scorecard_entered_after_actual_implementation_date_panel_title: "Number of Scorecards Entered After Actual Implementation Date"
  scorecard_entered_after_actual_implementation_date_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Number of Scorecards Entered After the Actual Implementation Date</h5>
    <p>This indicator shows the number of scorecards where the <strong>Entry Date</strong> is at least 1 day later than the <strong>Conducted Date</strong> (the date the implementation was actually carried out).</p>
    <p><strong>Note:</strong> Only approved(accepted) scorecards are counted.</p>
    <p><strong>Formula:</strong><br>
    Entry Date − Conducted Date ≥ 1 Day</p>
    <p><strong>Example:</strong><br>
    Implementation conducted on: 01-Jan-2022<br>
    Data entered on: 03-Jan-2022<br>
    → This case is counted, since the gap is 2 days (≥ 1 day).</p>
    </div>
  scorecard_implementation_duration_panel_title: "Scorecard Implementation Duration (Start Date to Approval)"
  scorecard_implementation_duration_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Scorecard Implementation Duration (Start Date to Approval[Accepted + Rejected])</h5>
    <p>This indicator measures the number of days between the <strong>start date</strong> and the <strong>approval date</strong> of a scorecard, showing the minimum, average, and maximum duration across all approved scorecards.</p>
    <p><strong>Note:</strong> Only approved(accepted) scorecards are counted.</p>
    <p><strong>Formula:</strong><br>
    Duration (days) = Approval Date − Start Date</p>
    <p><strong>Current values:</strong><br>
    Minimum: 1 day<br>
    Average: 17 days<br>
    Maximum: 36 days</p>
    <p><strong>Example:</strong><br>
    If a scorecard started on 01-Jan-2022 and was approved on 18-Jan-2022, its duration is 17 days — this falls close to the average.</p>
    </div>
  scorecard_participants_panel_title: "Number of (Total LNGOs / Total CAFs or Peers / Total Participants / Avg Participants)"
  scorecard_participants_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Count (Total LNGOs / Total CAFs / Total Participants / Average Participants)</h5>
    <p>This indicator shows four related counts side by side:</p>
    <ul>
      <li><strong>LNGOs</strong> — counted based on <em>Planned Scorecards(excluding rejected)</em></li>
      <li><strong>CAFs</strong> — counted based on <em>LNGO</em></li>
      <li><strong>Participants</strong> — counted based on <em>Approved Scorecards(excluding rejected)</em></li>
      <li><strong>Average Participants</strong> — the average number of participants per approved scorecard (excluding rejected)</li>
    </ul>
    <p><strong>Example:</strong><br>
    If there are 4 LNGOs, each linked to multiple CAFs, and the approved scorecards recorded a total of 141 participants, the average participants figure is calculated by dividing total participants by the number of approved scorecards(excluding rejected).</p>
    </div>
  scorecard_total_indicators_panel_title: "Total Indicators (Proposed / New Indicators / Prioritized)"
  scorecard_total_indicators_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Total Indicators (Proposed / New Indicators / Prioritized(selected indicators))</h5>
    <p>Counts raised indicators from approved scorecards (excluding rejected):</p>
    <ul>
      <li><strong>Proposed Indicators (Total)</strong> — all raised indicators</li>
      <li><strong>New Indicators (Total)</strong> — raised indicators that are custom (user-added)</li>
      <li><strong>Priority Indicators (Total)</strong> — raised indicators marked as selected</li>
    </ul>
    <p><strong>Example:</strong> A scorecard raises 5 indicators — 2 new, 1 priority. This adds 5 to Proposed, 2 to New, and 1 to Priority.</p>
    </div>
  scorecard_average_indicators_panel_title: "Average Indicators (Proposed / New Indicators / Prioritized)"
  scorecard_average_indicators_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Average Indicators (Proposed / New Indicators / Prioritized)</h5>
    <p>Shows the average number of raised indicators per approved scorecard (excluding rejected):</p>
    <ul>
      <li><strong>Proposed Indicators (Average)</strong> — average of all raised indicators per approved scorecard</li>
      <li><strong>New Indicators (Average)</strong> — average of custom (user-added) raised indicators per approved scorecard</li>
      <li><strong>Priority Indicators (Average)</strong> — average of raised indicators marked as selected per approved scorecard</li>
    </ul>
    <p><strong>Note:</strong> Results are rounded up (e.g., 0.3 → 1).</p>
    <p><strong>Example:</strong> If approved scorecards average 0.3 proposed indicators each, the displayed value is rounded up to 1.</p>
    </div>
  scorecard_total_by_service_type_panel_title: "Total Scorecards (Planned vs Approved) by Service Type"
  scorecard_total_by_service_type_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Total Scorecards (Planned vs Approved) by Service Type</h5>
    <p>This chart compares the number of <strong>Planned(excluding rejected)</strong> and <strong>Approved(excluding rejected)</strong> scorecards across different service types, allowing quick identification of gaps between planning and completion.</p>
    <p><strong>Current values:</strong></p>
    <ul>
      <li>Commune Administrative — Planned: 6 / Approved: 5</li>
      <li>Garment Factory — Planned: 9 / Approved: 3</li>
    </ul>
    <p><strong>Example:</strong> For Garment Factory, 9 scorecards were planned but only 3 were approved — indicating a gap of 6 scorecards not yet completed.</p>
    </div>
  scorecard_implemented_by_scorecard_type_panel_title: "Approved Scorecards by Scorecard Type"
  scorecard_implemented_by_scorecard_type_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Approved Scorecards by Scorecard Type</h5>
    <p>This chart compares approved scorecards across scorecard types (excluding rejected), broken down into three categories:</p>
    <ul>
      <li><strong>Self-Assessment</strong> — scorecard meeting that conducted with managements or authorizers(supply side)</li>
      <li><strong>Community Scorecard</strong> — scorecard meeting that conducted with community members or factory workers (demand side)</li>
      <li><strong>Combined Scorecard</strong> — scorecard meeting that joins both managements/authorizers and community members/factory workers</li>
    </ul>
    <p><strong>Current values:</strong></p>
    <ul>
      <li>Health Center — Self-Assessment: 11 / Community Scorecard: 0 / Combined Scorecard: 0</li>
      <li>Garment Factory — Self-Assessment: 0 / Community Scorecard: 0 / Combined Scorecard: 3</li>
    </ul>
    <p><strong>Example:</strong> For Garment Factory, all 3 approved scorecards fall under the Combined Scorecard category, with no Self-Assessment or Community Scorecard recorded separately.</p>
    </div>
  scorecard_implemented_by_type_panel_title: "Approved Scorecards by Scorecard Type"
  scorecard_implemented_by_type_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Approved Scorecards by Scorecard Type</h5>
    <p>This donut chart shows the proportion of approved scorecards(excluding rejected) split by type:</p>
    <ul>
      <li><strong>Self-Assessment</strong> — 51 scorecards (94%)</li>
      <li><strong>Combined Scorecard</strong> — 3 scorecards (6%)</li>
    </ul>
    <p><strong>Example:</strong> Out of 54 total approved scorecards, the vast majority (51) are Self-Assessment, while only 3 are Combined Scorecards (jointly conducted with both management and community/workers).</p>
    </div>
  scorecard_implemented_by_facility_panel_title: "Approved Scorecards by Service Type"
  scorecard_implemented_by_facility_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Approved Scorecards by Service Type</h5>
    <p>This donut chart shows the distribution of approved scorecards(excluding rejected) across service types. <em>This report includes only approved scorecards.</em></p>
    <ul>
      <li><strong>Commune Administrative</strong> — 20 scorecards (37%)</li>
      <li><strong>Primary School</strong> — 20 scorecards (37%)</li>
      <li><strong>Health Center</strong> — 11 scorecards (20%)</li>
      <li><strong>Garment Factory</strong> — 3 scorecards (6%)</li>
    </ul>
    <p><strong>Example:</strong> Out of 54 total approved scorecards, Commune Administrative and Primary School each account for the largest share (37% each), while Garment Factory makes up the smallest share (6%).</p>
    </div>
  scorecard_implementation_by_device_type_panel_title: "Scorecard Implementation by Device Type"
  scorecard_implementation_by_device_type_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Scorecard Entries by Device Type</h5>
    <p>This donut chart shows the breakdown of approved scorecards(excluding rejected) by the device used to enter data. <em>This report includes only approved scorecards.</em></p>
    <ul>
      <li><strong>Mobile</strong> — 64 scorecards (69%)</li>
      <li><strong>Tablet</strong> — 29 scorecards (31%)</li>
    </ul>
    <p><strong>Example:</strong> Out of 93 total approved scorecards, most (64) were entered using a mobile phone, while 29 were entered using a tablet.</p>
    </div>
  scorecard_participants_by_gender_panel_title: "Participants by Gender"
  scorecard_participants_by_gender_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Participants by Gender</h5>
    <p>This donut chart shows the breakdown of participants by gender. <em>This report includes only approved scorecards(excluding rejected).</em></p>
    <ul>
      <li><strong>Male</strong> — 176 participants (57%)</li>
      <li><strong>Female</strong> — 134 participants (43%)</li>
    </ul>
    <p><strong>Example:</strong> Out of 310 total participants, the majority (176) are male, while 134 are female.</p>
    </div>
  scorecard_participants_by_age_panel_title: "Participants by Age"
  scorecard_participants_by_age_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Participants by Age Group</h5>
    <p>This donut chart shows the breakdown of participants by age group. <em>This report includes only approved scorecards(excluding rejected).</em></p>
    <ul>
      <li><strong>Age 31–45</strong> — 171 participants (55%)</li>
      <li><strong>Age 15–30</strong> — 89 participants (29%)</li>
      <li><strong>Age &gt;45</strong> — 50 participants (16%)</li>
    </ul>
    <p><strong>Example:</strong> Out of 310 total participants, more than half (171) fall in the 31–45 age group, the largest share among all age groups.</p>
    </div>
  scorecard_participants_by_profile_panel_title: "Participants by Profile"
  scorecard_participants_by_profile_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Participants by Ethnicity/Group</h5>
    <p>This stacked bar chart shows the breakdown of participants by gender within each group. <em>This report includes only approved scorecards(excluding rejected).</em></p>
    <ul>
      <li><strong>Indigenous</strong> — Female: 38 / Total: 73</li>
      <li><strong>Youth</strong> — Female: 34 / Total: 55</li>
    </ul>
    <p><strong>Example:</strong> For the Indigenous group, 38 participants are female out of a total of 73 participants in that group, with the remainder being male.</p>
    </div>
  scorecard_top_5_proposed_criteria_panel_title: "Top 5 Most Proposed Indicators"
  scorecard_top_5_proposed_criteria_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Top 5 Most Frequently Raised Criteria</h5>
    <p>This chart shows the five criteria/indicators most frequently raised across approved scorecards. <em>This report includes only approved scorecards(excluding rejected).</em></p>
    <ul>
      <li><strong>Time</strong> — 16</li>
      <li><strong>Teaching</strong> — 10</li>
      <li><strong>Library</strong> — 9</li>
      <li><strong>Monthly Meeting</strong> — 8</li>
      <li><strong>Materials/Equipment</strong> — 7</li>
    </ul>
    <p><strong>Example:</strong> "Time" was raised 16 times, making it the most frequently cited criterion among approved scorecards — well ahead of "Teaching" at 10.</p>
    </div>
  scorecard_top_5_prioritized_criteria_panel_title: "Top 5 Most Prioritized Indicators"
  scorecard_top_5_prioritized_criteria_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Top 5 Most Frequently Priority Criteria</h5>
    <p>This chart shows the five priority criteria/indicators most frequently approved across scorecards. <em>This report includes only approved scorecards(excluding rejected).</em></p>
    <ul>
      <li><strong>Teaching</strong> — 5</li>
      <li><strong>Time</strong> — 5</li>
      <li><strong>Water Storage Tank</strong> — 4</li>
      <li><strong>Library</strong> — 4</li>
      <li><strong>Waste Disposal Area</strong> — 3</li>
    </ul>
    <p><strong>Example:</strong> "Teaching" and "Time" are tied as the most frequently approved priority criteria, each appearing 5 times across approved scorecards.</p>
    </div>
  scorecard_top_5_prioritized_criteria_happy_face_panel_title: "Top 5 Prioritized Indicators (😁 Satisfied)"
  scorecard_top_5_prioritized_criteria_happy_face_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Top 5 Priority Criteria (😄 Satisfied)</h5>
    <p>This chart shows the five priority criteria/indicators most frequently marked as "Satisfied(Score 4 and 5)" (😄) across approved scorecards(excluding rejected).</p>
    <ul>
      <li><strong>Time</strong> — 24</li>
      <li><strong>Monthly Meeting</strong> — 17</li>
      <li><strong>Service Delivery</strong> — 11</li>
      <li><strong>Teaching</strong> — 10</li>
      <li><strong>Duty Shift</strong> — 10</li>
    </ul>
    <p><strong>Example:</strong> "Time" received the most satisfaction votes (24), more than double the next highest, "Monthly Meeting" (17).</p>
    </div>
  scorecard_top_5_prioritized_criteria_neutral_face_panel_title: "Top 5 Prioritized Indicators (🙂 Acceptable)"
  scorecard_top_5_prioritized_criteria_neutral_face_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Top 5 Prioritized Indicators (🙂 Acceptable)</h5>
    <p>This chart shows the five prioritized indicators most frequently marked as "Acceptable(Score 3)" (🙂) across approved scorecards(excluding rejected).</p>
    <ul>
      <li><strong>Toilet/Sanitation</strong> — 14</li>
      <li><strong>Teaching</strong> — 13</li>
      <li><strong>Fence</strong> — 12</li>
      <li><strong>Weather/Climate</strong> — 11</li>
      <li><strong>Water Tank</strong> — 10</li>
    </ul>
    <p><strong>Example:</strong> "Toilet/Sanitation" received the most "Acceptable" votes (14), slightly ahead of "Teaching" (13).</p>
    </div>
  scorecard_top_5_prioritized_criteria_angry_face_panel_title: "Top 5 Prioritized Indicators (😡 Not Satisfied)"
  scorecard_top_5_prioritized_criteria_angry_face_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Top 5 Prioritized Indicators (😡 Not Satisfied)</h5>
    <p>This chart shows the five prioritized indicators most frequently marked as "Not Satisfied(Score 1 and 2)" (😡) across approved scorecards(excluding rejected).</p>
    <ul>
      <li><strong>Parent Involvement in Children's Education</strong> — 17</li>
      <li><strong>Library</strong> — 14</li>
      <li><strong>Students Have Many Books</strong> — 14</li>
      <li><strong>Students Drop Out of School</strong> — 11</li>
      <li><strong>Number of Students Compared to the Number of Classrooms</strong> — 9</li>
    </ul>
    <p><strong>Example:</strong> "Parent Involvement in Children's Education" received the highest number of "Not Satisfied" votes (17), signaling this as the top concern among evaluated indicators.</p>
    </div>
  scorecard_completion_rate_panel_title: "Scorecard Completion Rate (%)"
  scorecard_completion_rate_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Scorecard Completion Rate (%)</h5>
    <p>This indicator shows the percentage of planned scorecards that have been completed(accepted + rejected).</p>
    <p><strong>Formula:</strong><br>
    Completion Rate (%) = (Completed[Accepted + Rejected] Scorecards ÷ Planned Scorecards) × 100</p>
    <p><strong>Example:</strong><br>
    If 55 scorecards were planned and 45 were approved(accepted 44 + rejected 1), the completion rate is:<br>
    (45 ÷ 55) × 100 = 82%</p>
    </div>
  scorecard_geo_coverage_rate_panel_title: "Geographic Coverage Rate (%)"
  scorecard_geo_coverage_rate_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Geographic Coverage Rate (%)</h5>
    <p>This indicator shows the percentage of the planned geographic coverage that has been achieved, excluding any rejected scorecards.</p>
    <p><strong>Formula:</strong><br>
    Geographic Coverage Rate (%) = (Achieved Geographic Coverage ÷ Planned Geographic Coverage) × 100</p>
    <p><strong>Example:</strong><br>
    If the planned geographic coverage is 10 regions and 8 regions have been achieved, the geographic coverage rate is:<br>
    (8 ÷ 10) × 100 = 80%</p>
    </div>
  scorecard_beneficiary_reach_title: "Beneficiary Reach"
  scorecard_beneficiary_reach_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Beneficiary Reach</h5>
    <p>This table shows the demographic breakdown of total participants — each column displays the count followed by its percentage of the total.</p>
    <ul>
      <li><strong>Total Participants</strong> — 7</li>
      <li><strong>Female %</strong> — 6 (86%)</li>
      <li><strong>Youth %</strong> — 4 (57%)</li>
      <li><strong>Disability %</strong> — 0 (0%)</li>
      <li><strong>Minority %</strong> — 3 (43%)</li>
    </ul>
    <p><strong>Note:</strong> Only approved (accepted) scorecards are included.</p>
    <p><strong>Example:</strong> Out of 7 total participants, 6 are female (86%), 4 are youth (57%), and 3 belong to a minority group (43%). None of the participants reported a disability.</p>
    </div>
  data_quality_kpi_panel_title: "Data Quality KPI"
  data_quality_kpi_panel_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>Data Quality KPI</h5>
    <p>This table tracks key indicators of scorecard data quality across the review pipeline:</p>
    <ul>
      <li><strong># Submitted Scorecard</strong> — scorecards that have been submitted from CAFs/Peers</li>
      <li><strong># Approved (Accepted) Scorecard</strong> — scorecards that have been approved by Local NGO (excluding rejected ones)</li>
      <li><strong># Rejected Scorecard</strong> — scorecards that have been rejected by Program team</li>
      <li><strong># Custom Indicator Correction</strong> — custom indicators that were edited by Local NGO (i.e., updated after their initial creation)</li>
    </ul>
    <p><strong>Current values:</strong> 5 Submitted / 3 Approved / 1 Rejected / 0 Custom Indicator Corrections.</p>
    <p><strong>Example:</strong> Out of 5 submitted scorecards, 3 have been approved and 1 rejected, with 1 still pending review. No custom indicators have needed correction by Local NGO.</p>
    </div>
  fam_reporting_view_by_device_title: "FAM Reporting View by Device"
  fam_reporting_view_by_device_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>FAM Reporting View by Device</h5>
    <p>This section shows the distribution of FAM reports viewed via different devices.</p>
    <p>You can filter by time period to view FAM reporting trends.</p>
    <p><strong>Note:</strong> The FAM page is for general viewing and is not under any specific Program.</p>
    </div>
  fam_reporting_view_by_detail_title: "FAM Reporting View Detail"
  fam_reporting_view_by_detail_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5>FAM Reporting View Detail</h5>
    <p>This section provides a detailed view of FAM reports.</p>
    <p>You can filter by time period to view FAM reporting trends.</p>
    <p><strong>Note:</strong> The FAM page is for general viewing and is not under any specific Program.</p>
    </div>
  num_activities_by_waste_category_title: "# of Activities by Standard Waste Management Category"
  num_activities_by_waste_category_description: |
    <div lang="en-US" style="margin-bottom: 16px;">
    <h5># of Activities by Standard Waste Management Category</h5>
    <p>This section shows the number of activities categorized by standard waste management categories.</p>
    <p><strong>Example:</strong> If there are 10 activities, this section will show how many fall under each standard waste management category.</p>
    <p><strong>Note:</strong> It includes only activities from approved (accepted) scorecards.</p>
    </div>

